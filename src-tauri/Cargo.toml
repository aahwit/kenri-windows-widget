[package]
name = "kenri-desktop-companion"
version = "0.1.0"
description = "KENRI Desktop Companion"
authors = ["KENRI"]
edition = "2021"

[lib]
name = "kenri_desktop_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
